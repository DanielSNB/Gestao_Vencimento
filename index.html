<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Vencimentos + Estoque</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  
  <h2>📦 Controle de Vencimentos</h2>

  <div class="form">
    
    <input type="text" id="nome" placeholder="Produto">

    <!-- 🔥 SETOR (SUBSTITUI MARCA) -->
    <select id="marca">
      <option value="suplementos">Suplementos</option>
      <option value="medicamento">Medicamento</option>
      <option value="antipulgas">Antipulgas</option>
    </select>

    <input type="date" id="data">
    <input type="number" id="quantidade" placeholder="Quantidade">

    <select id="gestao">
      <option value="nao">Sem markdown</option>
      <option value="sim">Com markdown</option>
    </select>

    <button onclick="adicionar()">Adicionar</button>
  </div>

  <div class="filtro">
    <select id="filtroMarca">
      <option value="">Todos os setores</option>
    </select>
  </div>

  <div id="lista"></div>

</div>

<!-- ========================= -->
<!-- ESTOQUE (SEM ALTERAÇÃO) -->
<!-- ========================= -->

<div class="container estoque">

  <h2>📊 Controle de Erro de Estoque</h2>

  <div class="form">
    
    <input type="text" id="produtoEstoque" placeholder="Produto">

    <select id="setor">
      <option value="suplementos">Suplementos</option>
      <option value="medicamento">Medicamento</option>
      <option value="antipulgas">Antipulgas</option>
    </select>

    <input type="number" id="fisico" placeholder="Físico (loja)">
    <input type="number" id="logico" placeholder="Lógico (coletor)">

    <button onclick="adicionarEstoque()">Adicionar</button>
  </div>

  <div class="listas-estoque">
    
    <div>
      <h3>🟢 Sobras</h3>
      <div id="listaSobra"></div>
    </div>

    <div>
      <h3>🔴 Faltas</h3>
      <div id="listaFalta"></div>
    </div>

  </div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
